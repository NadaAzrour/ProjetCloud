<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - ToDo List Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Barre de navigation -->
    <nav class="bg-indigo-600 text-white px-6 py-4 flex justify-between items-center shadow-lg relative">
    <h1 class="text-2xl font-bold">ToDo List Cloud ☁</h1>

    <div class="relative">
        <button id="profileBtn" class="focus:outline-none">
            <img id="navProfileImage" 
                 src="https://via.placeholder.com/150" 
                 class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-md cursor-pointer hover:opacity-90">
        </button>

        <div id="dropdownMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl z-50 overflow-hidden text-gray-700">
            <a href="/profile" class="block px-4 py-3 hover:bg-gray-100 transition flex items-center gap-2">
                👤 Gérer le profil
            </a>
            <div class="border-t border-gray-100"></div>
            <button id="logoutBtn" class="block w-full text-left px-4 py-3 hover:bg-red-50 text-red-600 transition flex items-center gap-2">
                🚪 Déconnexion
            </button>
        </div>
    </div>
</nav>
        <div class="flex justify-center mt-6">
        <div class="bg-white shadow-md rounded-full px-6 py-2 text-indigo-700 font-semibold text-lg border border-indigo-300">
            <span id="userGreeting"></span>
        </div>
        </div>

    <div class="max-w-4xl mx-auto mt-10 bg-white rounded-2xl shadow-lg p-8">

        <h2 class="text-3xl font-bold text-indigo-600 mb-6 text-center">Tableau de Bord</h2>

        <!-- Formulaire d'ajout de tâche -->
        <form id="taskForm" class="mb-8 grid grid-cols-1 md:grid-cols-4 gap-4">
            <input type="text" name="title" placeholder="Titre de la tâche" class="border rounded-lg px-3 py-2 w-full focus:ring-2 focus:ring-indigo-400" required>

            <select name="priority" class="border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400">
                <option value="Basse">Basse</option>
                <option value="Moyenne">Moyenne</option>
                <option value="Haute">Haute</option>
            </select>

            <select name="category" class="border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400">
                <option value="Travail">Travail</option>
                <option value="Études">Études</option>
                <option value="Personnel">Personnel</option>
            </select>

            <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg px-4 py-2 transition">
                ➕ Ajouter
            </button>
        </form>

        <!-- Liste des tâches -->
        <div>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-indigo-600 uppercase text-sm">
                        <th class="py-3 px-4">Tâche</th>
                        <th class="py-3 px-4">Priorité</th>
                        <th class="py-3 px-4">Catégorie</th>
                        <th class="py-3 px-4 text-center">Statut</th>
                        <th class="py-3 px-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="tasksList">
                    <!-- Les tâches Firebase apparaîtront ici -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="static/js/firebase_config.js"></script>
    <script type="module" src="static/js/tasks.js"></script>
    <script type="module" src="static/js/auth.js"></script>


</body>
</html>
