<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - ToDo List Cloud</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <h2 class="text-3xl font-bold text-center text-indigo-600 mb-6">Inscription</h2>

    <form id="registerForm" class="space-y-5">
      
      <!-- Prénom -->
      <div>
        <label class="block text-gray-700 mb-1">Prénom</label>
        <input type="text" name="firstName" placeholder="Prénom"
               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400" required>
      </div>

      <!-- Nom -->
      <div>
        <label class="block text-gray-700 mb-1">Nom</label>
        <input type="text" name="lastName" placeholder="Nom"
               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400" required>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-gray-700 mb-1">Email</label>
        <input type="email" name="email" placeholder="Email"
               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400" required>
      </div>

      <!-- Niveau d'étude -->
      <div>
        <label class="block text-gray-700 mb-1">Niveau d'étude</label>
        <select name="niveauEtude" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400" required>
          <option value="">Sélectionner le niveau d'étude</option>
          <option value="Licence">Licence</option>
          <option value="Master">Master</option>
          <option value="Doctorat">Doctorat</option>
        </select>
      </div>

      <!-- Mot de passe -->
      <div>
        <label class="block text-gray-700 mb-1">Mot de passe</label>
        <input type="password" name="password" placeholder="Mot de passe"
               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400" required>
      </div>

      <!-- Confirmer mot de passe -->
      <div>
        <label class="block text-gray-700 mb-1">Confirmer mot de passe</label>
        <input type="password" name="confirmPassword" placeholder="Confirmer mot de passe"
               class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-400" required>
      </div>

      <button type="submit" class="w-full bg-indigo-500 text-white py-2 rounded-lg font-semibold hover:bg-indigo-600 transition">
        S’inscrire
      </button>
    </form>

    <p class="mt-4 text-center text-gray-600">
      Déjà inscrit ? 
      <a href="/login" class="text-indigo-500 hover:underline">Se connecter</a>
    </p>
  </div>

  <script type="module" src="/static/js/auth.js"></script>

</body>
</html>
