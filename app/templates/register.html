<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f4f7fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .card {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .flash {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 5px;
            color: white;
        }
        
        .flash.success {
            background-color: #28a745;
        }
        
        .flash.error {
            background-color: #dc3545;
        }
    </style>
</head>

<body>
    <div class="card">
        <h3 class="text-center mb-4"><i class="fas fa-user-plus"></i> Créer un compte</h3>

        {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %} {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %} {% endif %} {% endwith %}

        <form method="POST" action="{{ url_for('main.register') }}">
            <div class="mb-3">
                <label>Nom</label>
                <input type="text" class="form-control" name="nom" required>
            </div>

            <div class="mb-3">
                <label>Prénom</label>
                <input type="text" class="form-control" name="prenom" required>
            </div>

            <div class="mb-3">
                <label>Filière</label>
                <input type="text" class="form-control" name="filiere" required>
            </div>

            <div class="mb-3">
                <label>Niveau</label>
                <input type="text" class="form-control" name="niveau" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" name="email" required>
            </div>

            <div class="mb-3">
                <label>Mot de passe</label>
                <input type="password" class="form-control" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-user-plus"></i> S’inscrire</button>
        </form>

        <p class="text-center mt-3">Déjà un compte ? <a href="{{ url_for('main.login') }}">Se connecter</a></p>
    </div>
</body>

</html>
